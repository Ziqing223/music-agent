schema_version: 1
eval_corpus_version: p22-product-acceptance-v1
purpose: Map fixed product acceptance tasks onto the existing verification backbone; do not duplicate engineering tests.
baseline_reference:
  phase: P22-S1.11 verified
  product_version: 0.1.0
  git_head: ec55a03
  worktree_state_id:
    algorithm: sha256-manifest-v1
    value: sha256-manifest-v1:bdae579fed099fbc98a2d169ca0420c81f9876a97d8d6e5c004e35b3da0698fa
    scope:
    - src/**
    - app/**
    - tests/**
    - tools/**
    - pyproject.toml
    - README.md
    - AGENTS.md
    excluded:
    - .git/**
    - eval/**
    - '**/__pycache__/**'
    - '**/.build/**'
    - '**/.pytest_cache/**'
    - '*.pyc'
    - reports/patch artifacts outside the product scope
    construction: Sort scoped file paths; for each path append path + NUL + SHA256(file bytes) + newline; SHA256 the resulting
      manifest. Eval files are excluded to avoid self-reference.
  verified_engineering_regression: 5374 / 5374 tests OK on real macOS (owner-supplied baseline)
reproducibility_metadata:
  required_per_eval_run:
  - product_version
  - git_head
  - worktree_state_id
  - eval_corpus_version
  - platform
  - python_version
  - provider
  - model
  - database_fixture_or_state_snapshot
  capture_policy:
    product_version: read from project version at run time
    git_head: git rev-parse HEAD at run time; never use alone as product identity
    worktree_state_id: compute external content identity with the algorithm above
    eval_corpus_version: use this file value
    platform: capture at eval run; unavailable until run
    python_version: capture at eval run; unavailable until run
    provider: capture at eval run; N/A for deterministic-only cases
    model: capture at eval run; N/A for deterministic-only cases
    database_fixture_or_state_snapshot: record fixture DB/state snapshot ID or mark unavailable with reason
coverage_status_values:
- COVERED
- PARTIAL
- GAP
- UAT-ONLY
- NOT-APPLICABLE
failure_layers:
- Intent
- Context
- Authority
- Selection
- Tool
- Execution
- Readback
- Presentation
- Observability
- Eval Infrastructure
evidence_schema:
  fields:
    eval_case_id: provided by Product Eval layer; currently unavailable in production runtime
    product_version: external run metadata
    run_id: RecommendationRun when applicable
    turn_id: unavailable as a unified runtime field
    input: Product Eval case input
    precondition: Product Eval case metadata
    expected_behavior: Product Eval case metadata
    actual_intent: TurnPlan/interpreter result; currently mostly in-process
    actual_route: router/fast-path decision; currently mostly in-process
    relevant_context: ActiveMusicContext + request/run context where available
    selected_target: SelectionGrant/ActionAttempt or workflow-selected canonical when applicable
    selection_authority: derive from SelectionGrant/code path; not a first-class durable field
    selection_grant: in-memory SelectionGrant when applicable
    tool_name: AgentRequestJournalRepository
    tool_parameters: AgentRequestJournalRepository request payload
    tool_result: AgentRequestJournalRepository result
    preview_or_playback_eligibility: capability/binding/runtime evidence when applicable
    executed_target: action tool canonical target when applicable
    readback_target: get_now_playing / ActionAttempt readback when applicable
    final_state: ActionAttempt/runtime state; not unified durably
    final_response: Provider/Web/CLI result; not unified durably
    retry_count: derive from ProviderRunTrace/tool sequence
    latency_ms: ProviderRunTrace/tool measures when instrumentation is enabled
    automated_result: eval adapter/test result
    owner_uat_result: Product Eval/UAT record; historical UAT is not yet keyed by eval_case_id
    failure_layer: Product Eval classification
    root_cause_status: Product Eval/UAT triage classification
  real_action_identity_rule: intended target == selected target == executed target == readback target == user-visible verified
    target; if any required equality is unavailable, do not mark the real action as verified success.
tasks:
- task_id: ACPT-REC-001
  name: Scene-based Recommendation
  category: Recommendation
  type: Core
  priority: P0
  input:
  - 推荐几首适合晚上听的歌
  - 我喜欢 IU，推荐几首适合晚上听的歌
  precondition:
  - recommendation execution available
  - catalog/library state is a controlled or known fixture
  required_context:
  - current user scene constraint
  - current session context
  - long-term preference only as supporting context
  expected_behavior:
  - enter recommendation path
  - preserve the current scene constraint through recommendation semantics
  - use current scene/session constraints ahead of unrelated historical preference
  - return real available candidates or fail closed
  expected_intent: recommendation
  expected_tool_behavior:
  - use existing recommendation generation/discovery tools only
  - do not invent unsupported candidate capability
  expected_state_behavior:
  - scene is turn/session-scoped unless separately expressed as durable preference
  - RecommendationRun owns delivered result identity
  expected_output:
  - user-visible recommendation batch grounded in the authoritative run
  - honest no-result if no eligible candidates
  must_not:
  - recommend only from unrelated long-term preference while ignoring explicit scene
  - fabricate candidate or capability
  - persist the temporary scene as long-term preference
  pass_criteria:
  - routing is recommendation
  - scene survives semantic resolution
  - authoritative result is real and user-visible output uses that result
  fail_criteria:
  - scene is dropped or contradicted
  - unrelated history overrides explicit scene
  - fabricated or unavailable candidate is presented as valid
  automation_level: partial_existing_automated
  owner_uat_required: conditional
  evidence_requirements:
  - intent/routing
  - relevant current context
  - recommendation run/result set
  - final response
  existing_tests:
  - file: tests/test_intent_router.py
    case: S3TaskSurfaceClassificationTest.test_explicit_recommendation_semantics_are_distinct
  - file: tests/test_intent_router.py
    case: S3TaskSurfaceClassificationTest.test_recommendation_request_covers_closed_set_and_direction_form
  - file: tests/test_provider_agent.py
    case: ProviderAgentLoopTest.test_explicit_seed_replaces_model_target_but_preserves_scene_arguments
  - file: tests/test_provider_agent.py
    case: ProviderAgentLoopTest.test_preference_scene_empty_pool_expands_catalog_then_retries
  runtime_evidence:
  - source: TurnPlan / recommendation semantics
    availability: in_process_only
    fields:
    - actual_intent
    - scene
  - source: RecommendationRun / RecommendationHistoryRepository
    availability: available
    fields:
    - run_id
    - request
    - items
  - source: AgentRequestJournalRepository
    availability: available
    fields:
    - tool_name
    - tool_parameters
    - tool_result
  evidence_gaps:
  - no single product-level assertion proves final semantic scene fit versus unrelated long-term preference
  - final_response is not durably joined to a product eval case
  coverage_status: PARTIAL
  gap_categories:
  - Context
  - Presentation
  - Eval Infrastructure
  confidence: HIGH
  regression_candidate: Future minimal product-level scene-priority case; do not duplicate existing routing/propagation tests.
