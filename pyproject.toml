[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "music-agent-core"
version = "0.1.0"
description = "Local-first AI music companion for Apple Music on macOS"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = ["jsonschema>=4.23,<5"]

[project.scripts]
music-agent = "music_agent.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
music_agent = ["canonical_music_model.schema.json", "ui/*.html"]
"music_agent.migrations" = ["*.sql"]

[tool.unittest]
start-directory = "tests"
pattern = "test_*.py"
