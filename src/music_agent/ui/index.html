/* deterministic particle table, built once at parse time: nothing here
   animates. Row = [x, y, role, size, opacity, glow, gyre, R, flowPeriod,
   breathePeriod, phaseA, phaseB, dir, colorIdx] -- the flow slots (6-9)
   are parked at zero; T8 reads position plus the parked dynamics draws
   (p[10..12] double as the seeded swell-envelope lerp fractions, so the
   stagger keys stay a pure function of the row). Every dot holds one
   stated size (5.0) and a rest opacity drawn in the 0.30-0.45 band:
   the whole field reads visible at rest. Background alpha baked at 1. */
const TP_PARTICLES = (function () {
  const r = tpRng(20260824);
  const pts = [];
  function push(x, y, role, glow) {
    const ci = (r() * TP_ROLE_COLORS[role].length) | 0;
    const restO = 0.30 + r() * 0.15;   // seeded rest opacity, 0.30-0.45 band
    pts.push([tpR1(x), tpR1(y), role, 5.0, restO, glow, 0, 0, 0, 0, 0, 0, 0, ci]);
  }
  /* one plain double loop over the grid -- positions are EXACT grid
     points (no jitter, no spiral, no lanes: a dot is a grid seat, the
     circle comes from the distance crop alone) and roles grade by grid
     distance from the centre. Structural counts by construction, no
     rejection loops anywhere in the table build */
  for (let iy = 0; iy < TP_GRID_N; iy++) {
    for (let ix = 0; ix < TP_GRID_N; ix++) {
      const dx = ix - 9, dy = iy - 9;
      const dist = Math.hypot(dx, dy);
      if (dist > TP_GRID_KEEP) continue;
      const role = dist < 3 ? 2                       // heart: the centre + its nearest two rings
        : (TP_PINK_SEATS[ix + "," + iy] ? 3           // pink: twelve fixed warm grid seats
          : (dist <= 6.7 ? 1 : 0));                   // body inside 6.7 cells, fringe beyond
      push(TP_HEART.x + dx * TP_GRID_CELL, TP_HEART.y + dy * TP_GRID_CELL, role, role === 2 ? 1 : 0);
    }
  }
  /* dynamics: only the fields the frozen lifecycle reads -- p[12] =
     wave direction, p[11] = exit speed; p[10] stays parked (held at
     its historical draw). The three line up as the seeded lerp
     fractions the swell envelope derives from, so no additional
     draw is needed. The retired flow slots stay zeroed */
  for (const p of pts) {
    p[6] = 0; p[7] = 0; p[8] = 0; p[9] = 0;
    p[10] = r();
    p[11] = r();
    p[12] = r() * 6.2832;
  }

})();

/* capability probe + reduced motion, both read once; the engine adapts
   below instead of assuming either */
const TP_WAAPI = (function () {
  try { return typeof Element !== "undefined" && typeof Element.prototype.animate === "function"; }
  catch (e) { return false; }
})();
let TP_REDUCED_MQ = null;
try {
  TP_REDUCED_MQ = (typeof matchMedia === "function") ? matchMedia("(prefers-reduced-motion: reduce)") : null;
} catch (e) { TP_REDUCED_MQ = null; }
function tpReduced() { try { return !!(TP_REDUCED_MQ && TP_REDUCED_MQ.matches); } catch (e) { return false; } }

let tpSystem = null;  // the active generation: { gen, nodes, anims, static, done }
let tpExiting = null; // residual exiting generation awaiting release cleanup
let tpGen = 0;
let TP_BOX = null;
function tpBox() {
  if (!TP_BOX) TP_BOX = document.querySelector(".thinking-particles");
  return TP_BOX;
}
function tpMakeNode(p) {
  const c = TP_ROLE_COLORS[p[2]][p[13]];
  const el = document.createElement("div");
  el.className = "tp";
  el.style.cssText =
    "left:" + p[0] + "px;top:" + p[1] + "px;width:" + p[3] + "px;height:" + p[3] + "px;" +
    "background:rgba(" + c[0] + "," + c[1] + "," + c[2] + ",1);" +
    (p[5] ? "box-shadow:0 0 4px 1px rgba(" + c[0] + "," + c[1] + "," + c[2] + ",0.35);" : "");
  return el;
}
/* the demo stagger, densified and re-tuned as one outward breath:
   the ONE swell sequence every dot shares -- scale 0.70-0.78 and
   opacity 0.30-0.45 at rest, one smooth bump to 1.20-1.35 /
   0.85-1.00 over 500ms on true sine inOut, back to rest over
   1000ms on true sine out, then a soft hold at rest to the loop
   end (offsets are fractions of the shared 3400ms loop: 0.147 =
   500ms, 0.441 = 1500ms). Envelope values are seeded per dot
   from the parked dynamics draws, so this stays a pure function
   of the row; the stagger lives entirely in each dot's start
   offset, in grid order from the centre. Zero randomness in the
   motion model, and the minimum scale anywhere is the rest scale
   >= 0.70 -- the dots never shrink toward nothing. */
function tpStaggerKeys(p) {
  /* from='center' grid stagger exactly as anime computes it: Euclidean
     grid distance from the centre x 140ms, as a fraction of the
     shared loop. The centre dot waits nothing; each neighbour waits
     one more step; the crest band spreads outward ring by ring and
     the loop resets as one. Positions never move, scale + opacity
     only -- no angle terms, no translation. */
  const dx = (p[0] - TP_HEART.x) / TP_GRID_CELL;
  const dy = (p[1] - TP_HEART.y) / TP_GRID_CELL;
  const dist = Math.hypot(dx, dy);
  const phase = dist * TP_STAGGER_STEP / TP_STAGGER_PERIOD;
  const restS = 0.70 + 0.08 * p[11];                 // rest scale, 0.70-0.78
  const peakS = 1.20 + 0.15 * (p[12] / 6.2832);      // peak scale, 1.20-1.35
  const restO = p[4];                                // rest opacity, 0.30-0.45 (table build)
  const peakO = 0.85 + 0.15 * p[10];                 // peak opacity, 0.85-1.00
  const keys = [
    { offset: 0,     transform: "scale(" + restS.toFixed(2) + ")", opacity: restO, easing: TP_EASE_IN_OUT_SINE },
    { offset: 0.147, transform: "scale(" + peakS.toFixed(2) + ")", opacity: peakO, easing: TP_EASE_OUT_SINE },
    { offset: 0.441, transform: "scale(" + restS.toFixed(2) + ")", opacity: restO },
    { offset: 1,     transform: "scale(" + restS.toFixed(2) + ")", opacity: restO },
  ];

}
function tpStaticCompose(sys) {
  /* reduced-motion / no-WAAPI path: the deterministic density
     composition, fully formed, zero animations and zero timers */
  sys.static = true;
  const box = tpBox();
  if (!box) return;
  const frag = document.createDocumentFragment();
  for (const p of TP_PARTICLES) {
    const el = tpMakeNode(p);
    el.style.opacity = String(p[4]);
    /* the static field IS the field at rest: hold the same swell-rest
       scale the loop rests on, so reduce/re-enter never pops */
    el.style.transform = tpStaggerKeys(p).keys[0].transform;
    frag.appendChild(el);
    sys.nodes.push(el);
  }
  box.appendChild(frag);
}
function tpMotionCompose(sys, rng) {
  const box = tpBox();
  if (!box) { sys.static = true; return; }
  sys.static = false;
  /* no per-activation motion randomness: the stagger tween is a fixed
     port of the demo and identical every run -- the seeded stream only
     drives the one-shot enter directions and delays below */
  /* radial-out aggregation: the heart assembles first, fringe last */
  const order = TP_PARTICLES.slice().sort(function (a, b) {
    return Math.hypot(a[0] - TP_HEART.x, a[1] - TP_HEART.y) -
           Math.hypot(b[0] - TP_HEART.x, b[1] - TP_HEART.y);
  });
  const frag = document.createDocumentFragment();
  const rows = [];
  for (let i = 0; i < order.length; i++) {
    const p = order[i];
    const w = tpStaggerKeys(p);
    const el = tpMakeNode(p);
    el.style.left = w.x + "px";
    el.style.top = w.y + "px";
    el._p = p;
    el._f = w;
    frag.appendChild(el);
    sys.nodes.push(el);
    rows.push([el, p, i]);

  box.appendChild(frag);
  for (let i = 0; i < rows.length; i++) {
    const el = rows[i][0], p = rows[i][1], idx = rows[i][2];
    const dist = 150 + rng() * 170;
    const dx = Math.cos(p[12]) * dist, dy = Math.sin(p[12]) * dist;
    const dur = 700 + rng() * 700;

           swell-rest scale and opacity until its slot), plays the

  tpSystem = sys;

}
function tpExit() {
  if (!tpSystem) return;
  const sys = tpSystem;
  tpSystem = null;                           // the slot is free immediately
  tpExiting = sys;

       reduced-motion CSS owns the transition, if any) */

    window.setTimeout(function () { tpTeardown(sys); }, 450);

     the belt below is a one-shot ceiling, not a poller */
  for (const a of sys.anims) { try { a.onfinish = null; a.cancel(); } catch (e) { /* noop */ } }
  sys.anims.length = 0;
  for (const node of sys.nodes) {
    const p = node._p;
    if (!p) continue;
    const dist = 120 + 60 * p[11];
    const restT = node._f.keys[0].transform;
    try {
      /* explicit first keyframe: after the loop is cancelled nothing
         would otherwise hold the rest scale/opacity, so the release
         starts from the dot's exact swell rest -- no growth pop
         during the fade-out */
      const rel = node.animate(
        [ { transform: "translate(0px, 0px) " + restT, opacity: p[4] }, { transform: "translate(" + (Math.cos(p[12]) * dist).toFixed(1) + "px, " + (Math.sin(p[12]) * dist).toFixed(1) + "px) " + restT, opacity: 0 } ],

  if (!sys || sys.done) return;
  sys.done = true;
  const box = tpBox();
  for (const a of sys.anims) { try { a.onfinish = null; a.cancel(); } catch (e) { /* noop */ } }

    try { if (box && node.parentNode === box) box.removeChild(node); } catch (e) { /* noop */ }
